name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
            
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --base-ref=/brain-cache/

      - name: Deploy to gh-pages
        run: npx angular-cli-ghpages --dir=dist/brain-cache/browser
                
            
